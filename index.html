  <!-- CRITICAL: Inline loading styles load INSTANTLY (no network dependency) -->
  <style>
    /* Reset & Loading screen - MUST be first */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      /* Dynamic viewport height for mobile */
      background: #f5f4f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;

      /* START HIDDEN, FADE IN ONLY IF SLOW (Network Delay > 1s) */
      opacity: 0;
      animation: fadeInLoader 0.5s ease-out forwards 1.0s;
    }

    @keyframes fadeInLoader {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    #app-loader.hidden {
      opacity: 0 !important;
      visibility: hidden;
      animation: none !important;
      /* Cancel fade-in if we hide it */
    }

    .loader-logo {
      font-size: 2rem;
      font-weight: 700;
      color: #18181b;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .loader-logo img {
      filter: none;
    }

    .loader-logo svg {
      width: 40px;
      height: 40px;
      color: #18181b;
    }

    .loader-icons {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .loader-icon {
      width: 48px;
      height: 48px;
      color: #a1a1aa;
      animation: iconPulse 1.5s ease-in-out infinite;
      opacity: 0.5;
    }

    .loader-icon:nth-child(1) {
      animation-delay: 0s;
    }

    .loader-icon:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loader-icon:nth-child(3) {
      animation-delay: 0.3s;
    }

    .loader-icon:nth-child(4) {
      animation-delay: 0.45s;
    }

    .loader-icon:nth-child(5) {
      animation-delay: 0.6s;
    }

    @keyframes iconPulse {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(1);
        color: #a1a1aa;
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
        color: #18181b;
      }
    }

    .loader-text {
      color: #52525b;
      font-size: 0.875rem;
      letter-spacing: 0.05em;
    }

    .loader-dots {
      display: inline-flex;
      gap: 4px;
      margin-left: 4px;
    }

    .loader-dots span {
      width: 4px;
      height: 4px;
      background: #18181b;
      border-radius: 50%;
      animation: dotBounce 1.2s ease-in-out infinite;
    }

    .loader-dots span:nth-child(1) {
      animation-delay: 0s;
    }

    .loader-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loader-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes dotBounce {

      0%,
      100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      50% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }

    /* Premium UI Animations */
    @keyframes slideUpFade {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-slide-up {
      opacity: 0;
      animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Base body styles */
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f4f2;
      color: #18181b;
      zoom: 0.9;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f5f4f2;
    }

    ::-webkit-scrollbar-thumb {
      background: #d4d4d8;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #a1a1aa;
    }
  </style>
