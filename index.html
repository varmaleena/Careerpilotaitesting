<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerPilot - AI Career Companion</title>

  <!-- CRITICAL: Inline loading styles load INSTANTLY (no network dependency) -->
  <style>
    /* Reset & Loading screen - MUST be first */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      /* Dynamic viewport height for mobile */
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #app-loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-logo {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .loader-logo svg {
      width: 40px;
      height: 40px;
      color: #818cf8;
    }

    .loader-icons {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .loader-icon {
      width: 48px;
      height: 48px;
      color: #64748b;
      animation: iconPulse 1.5s ease-in-out infinite;
      opacity: 0.5;
    }

    .loader-icon:nth-child(1) {
      animation-delay: 0s;
    }

    .loader-icon:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loader-icon:nth-child(3) {
      animation-delay: 0.3s;
    }

    .loader-icon:nth-child(4) {
      animation-delay: 0.45s;
    }

    .loader-icon:nth-child(5) {
      animation-delay: 0.6s;
    }

    @keyframes iconPulse {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(1);
        color: #64748b;
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
        color: #818cf8;
      }
    }

    .loader-text {
      color: #94a3b8;
      font-size: 0.875rem;
      letter-spacing: 0.05em;
    }

    .loader-dots {
      display: inline-flex;
      gap: 4px;
      margin-left: 4px;
    }

    .loader-dots span {
      width: 4px;
      height: 4px;
      background: #818cf8;
      border-radius: 50%;
      animation: dotBounce 1.2s ease-in-out infinite;
    }

    .loader-dots span:nth-child(1) {
      animation-delay: 0s;
    }

    .loader-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loader-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes dotBounce {

      0%,
      100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      50% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }

    /* Base body styles */
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f1f5f9;
      zoom: 0.9;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>

  <!-- PERFORMANCE: Resource hints for faster connections -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://esm.sh">

  <!-- PERFORMANCE: Preload critical font (loads in parallel, high priority) -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  </noscript>

  <!-- Tailwind CSS CDN (async loading) -->
  <script async src="https://cdn.tailwindcss.com"></script>

</head>
